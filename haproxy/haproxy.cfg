global
    daemon
    maxconn 256

defaults
    mode http
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend http-in
    bind *:80
    acl is_api path_beg /api/
    acl is_stats path_beg /stats
    use_backend backend if is_api
    use_backend stats_backend if is_stats
    default_backend frontend

backend frontend
    server frontend frontend:5173

backend backend
    balance roundrobin
    server apache-container-1 apache-container-1:8000 check
    server apache-container-2 apache-container-2:8000 check
    server apache-container-3 apache-container-3:8000 check

backend stats_backend
    mode http
    stats enable
    stats uri /stats

